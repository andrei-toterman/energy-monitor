        lifetime:
          $ref: '#/components/schemas/StorageEnergyBreakdown'
    StorageEnergyBreakdown:
      type: object
      properties:
        discharge:
          type: string
          description: Discharged energy. Unit kWh.
        charge:
          type: string
          description: Charged energy. Unit kWh.
        produced:
          type: string
          description: Produced energy. Unit kWh.
        consumed:
          type: string
          description: Consumed energy. Unit kWh.
        exported:
          type: string
          description: Exported energy. Unit kWh.
        imported:
          type: string
          description: Imported energy. Unit kWh.
    StoragePeriodData:
      type: object
      description: Response for hourly/daily/monthly/yearly modes. Unit kWh.
      properties:
        time:
          type: array
          items:
            type: string
        discharge:
          type: array
          items:
            type: string
        charge:
          type: array
          items:
            type: string
        produced:
          type: array
          items:
            type: string
        consumed:
          type: array
          items:
            type: string
        exported:
          type: array
          items:
            type: string
        imported:
          type: array
          items:
            type: string
    MinutelyStorageData:
      type: object
      description: Response for minutely mode.
      properties:
        today:
          $ref: '#/components/schemas/StorageEnergyBreakdown'
        time:
          type: array
          description: Time list, each point in HH:mm format.
          items:
            type: string
        power:
          type: object
          description: Power lists keyed by direction. Unit W.
          additionalProperties:
            type: array
            items:
              type: string
        energy:
          type: object
          description: Energy lists keyed by direction. Unit kWh.
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: Request parameter exception (code 4000/4001) or other business error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            code: 4001
    Unauthorized:
      description: Application account or access token exception (codes 2000-3004).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            code: 2002
    ServerError:
      description: Internal server or communication exception (codes 5000, 6000, 7000-7003).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
          example:
            code: 5000
